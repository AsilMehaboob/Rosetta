sources:
  annotate:
  - model: gemini-3.5-flash-lite
    prompt_version: annotate-4
  assemble_version: assemble-3
  detector_version: detect-3
tables:
  GENAIVF.V_MNP_ACTUAL:
    as_of_sql: null
    columns:
    - confidence: high
      description: Actual porting date and time forwarded by BTK, from which the subscriber can use their new line.
      name: NUM_PORT_ACTUAL_DUE_DT
      shape: date
      type: DATE
    - confidence: high
      description: The operator from which the number is ported away (donor operator).
      meanings:
        Turkcell: Turkcell as the donor operator
        Türk Telekom: Türk Telekom as the donor operator
        Vodafone: Vodafone as the donor operator
      name: DONOR_SP_NAME
      shape: code
      type: VARCHAR2(72)
      values:
      - Vodafone
      - Turkcell
      - Türk Telekom
    - confidence: high
      description: The operator to which the number is ported (recipient operator).
      meanings:
        Turkcell: Turkcell as the applied/recipient operator
        Türk Telekom: Türk Telekom as the applied/recipient operator
        Vodafone: Vodafone as the applied/recipient operator
      name: APPLIED_SP_NAME
      shape: code
      type: VARCHAR2(72)
      values:
      - Vodafone
      - Turkcell
      - Türk Telekom
    - confidence: high
      description: Subscriber customer combination type.
      meanings:
        POS CBU: Postpaid Consumer Business Unit
        POS EBU: Postpaid Enterprise Business Unit
        PRE CBU: Prepaid Consumer Business Unit
        PRE EBU: Prepaid Enterprise Business Unit
      name: SUBS_CUST_COMB_TYPE
      shape: code
      type: VARCHAR2(44)
      values:
      - POS CBU
      - PRE CBU
      - POS EBU
      - PRE EBU
    - confidence: high
      description: Number porting actual group status description, which is always Success.
      meanings:
        Success: Successful number porting operation group status
      name: NUM_PORT_ACTUAL_GRP_STATUS_DESC
      shape: constant
      type: VARCHAR2(44)
      values:
      - Success
    current_sql: null
    description: The table GENAIVF.V_MNP_ACTUAL contains records of mobile number portability (MNP) actual operations,
      detailing the donor and applied operators, subscriber customer combination types, and the actual due dates
      for number porting.
    grain:
      columns: []
      text: no unique column and no entity + date combination found; count with care
      verified: false
    kind: unkeyed
    row_count: 5788
    row_meaning: Each row represents a completed mobile number porting actual operation.
    rule: null
    unknowns:
    - Whether any testing or dummy records are embedded within the subscriber customer types or operator names without
      explicit flagging.
  GENAIVF.V_MNP_REQUEST:
    as_of_sql: null
    columns:
    - confidence: high
      description: Number portability request type description, indicating Port In or Port Out.
      meanings:
        Port In: Number porting into our network
        Port Out: Number porting out to another operator network
      name: NUM_PORT_REQUEST_TYPE_DESC
      shape: flag
      type: VARCHAR2(48)
      values:
      - Port In
