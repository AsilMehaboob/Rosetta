    current_sql: '"SNAPSHOT_DT" = (SELECT MAX("SNAPSHOT_DT") FROM "VID"."F_SUBSCRIPTION_D")'
    description: Daily snapshot table of mobile subscriptions in the Vodafone Turkey database, tracking subscription
      statuses, tariff details, technical capabilities, service opt-ins, and migration flags.
    grain:
      columns:
      - SUBSCRIPTION_ID
      - SNAPSHOT_DT
      text: one row per SUBSCRIPTION_ID per SNAPSHOT_DT
      verified: true
    kind: snapshot
    row_count: 63000
    row_meaning: Each row represents a single subscription on a specific snapshot date.
    rule: each SUBSCRIPTION_ID appears once per SNAPSHOT_DT; for the current state use SNAPSHOT_DT = 2026-08-28T00:00:00;
      counting entities across several SNAPSHOT_DT values counts each one several times
    unknowns:
    - Meaning of specific numerical codes in STATUS_ID other than 1, 2, 3, 4, 5, 6, 9 from D_STATUS since reference
      rows were truncated or partial.
