    current_sql: '"SNAPSHOT_DT" = (SELECT MAX("SNAPSHOT_DT") FROM "VID"."F_SUBSCRIPTION_D")'
    description: Daily snapshot table of mobile subscriptions in the Vodafone database, containing subscription
      details, status, main tariff plans, dates of activations/disconnections, and various service opt-in indicators.
    grain:
      columns:
      - SUBSCRIPTION_ID
      - SNAPSHOT_DT
      text: one row per SUBSCRIPTION_ID per SNAPSHOT_DT
      verified: true
    kind: snapshot
    row_count: 63000
    row_meaning: One row represents a subscription snapshot on a specific date (SNAPSHOT_DT).
    rule: each SUBSCRIPTION_ID appears once per SNAPSHOT_DT; for the current state use SNAPSHOT_DT = 2026-08-28T00:00:00;
      counting entities across several SNAPSHOT_DT values counts each one several times
    unknowns:
    - Exact definitions of some internal migration sub-types beyond the provided comments
    - Meaning of ORGINATING_SHOP_ID as its comment is null
