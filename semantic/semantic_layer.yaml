    current_sql: '"SNAPSHOT_DT" = (SELECT MAX("SNAPSHOT_DT") FROM "VID"."F_SUBS_MAF_ANALYSIS_D")'
    description: Daily snapshot table capturing subscriber MAF (Mobile Analysis and Financial/Discount) information,
      including current tariffs, contract prices, and various discount attributes such as smart discounts, Vodafone
      Para discounts, and activation discounts.
    grain:
      columns:
      - SUBSCRIPTION_ID
      - SNAPSHOT_DT
      text: one row per SUBSCRIPTION_ID per SNAPSHOT_DT
      verified: true
    kind: snapshot
    row_count: 39102
    row_meaning: One row represents a subscriber's MAF analysis state and associated tariff/discount details for
      a specific snapshot date.
    rule: each SUBSCRIPTION_ID appears once per SNAPSHOT_DT; for the current state use SNAPSHOT_DT = 2026-08-28T00:00:00;
      counting entities across several SNAPSHOT_DT values counts each one several times
    unknowns:
    - Exact business calculation logic for MAF_TARIFF_DISCOUNTED and MAF_SMART_TL_DISCOUNTED.
    - Precise rules differentiating various SMART and VODAPARA discount columns.
