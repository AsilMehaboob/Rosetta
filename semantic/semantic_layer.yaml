    current_sql: '"SNAPSHOT_DT" = (SELECT MAX("SNAPSHOT_DT") FROM "VID"."F_SUBS_MAF_ANALYSIS_D")'
    description: Daily snapshot table containing subscriber Mobile Advertising and Financial (MAF) analysis, tariff
      offerings, discount details, and subscription attributes.
    grain:
      columns:
      - SUBSCRIPTION_ID
      - SNAPSHOT_DT
      text: one row per SUBSCRIPTION_ID per SNAPSHOT_DT
      verified: true
    kind: snapshot
    row_count: 39102
    row_meaning: One row represents a snapshot of a subscriber's (SUBSCRIPTION_ID) MAF analysis and attributes on
      a specific SNAPSHOT_DT.
    rule: each SUBSCRIPTION_ID appears once per SNAPSHOT_DT; for the current state use SNAPSHOT_DT = 2026-08-28T00:00:00;
      counting entities across several SNAPSHOT_DT values counts each one several times
    unknowns:
    - Exact business formulas for MAF analysis and discounts like MAF_TARIFF_DISCOUNTED, SMART_DISCOUNT_AMT, and
      VODAPARA_AMT_BA.
    - Exact definition of MSISDN data masking rules.
