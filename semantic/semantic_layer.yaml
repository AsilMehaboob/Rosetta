    kind: snapshot
    row_count: 42000
    row_meaning: Each row represents a snapshot of a single customer's profile and state for a specific date.
    rule: each CUST_ID appears once per SNAPSHOT_DT; for the current state use SNAPSHOT_DT = 2026-08-28T00:00:00;
