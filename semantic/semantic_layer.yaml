    current_sql: '"SNAPSHOT_DT" = (SELECT MAX("SNAPSHOT_DT") FROM "VID"."F_SUBSCRIPTION_USAGE_METRIC_D")'
    description: This table stores daily snapshots of subscription 5G usage metrics and device capabilities, with
      one row per subscription per snapshot date.
    grain:
      columns:
      - SUBSCRIPTION_ID
      - SNAPSHOT_DT
      text: one row per SUBSCRIPTION_ID per SNAPSHOT_DT
      verified: true
    kind: snapshot
    row_count: 63000
    row_meaning: One row represents the 5G usage metric and status for a specific subscription on a specific snapshot
      date.
    rule: each SUBSCRIPTION_ID appears once per SNAPSHOT_DT; for the current state use SNAPSHOT_DT = 2026-08-28T00:00:00;
      counting entities across several SNAPSHOT_DT values counts each one several times
    unknowns:
    - Exact business logic for what constitutes possible 5G vs 5G eligibility.
    - Why DEVC_LAST_5G_SET_ENABLE_DT and DEVC_LAST_5G_SET_DISABLE_DT have low fill rates.
