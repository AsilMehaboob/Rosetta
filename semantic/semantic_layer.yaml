sources:
  annotate:
  - model: gemini-3.5-flash-lite
    prompt_version: annotate-3
  assemble_version: assemble-1
  detector_version: detect-3
tables:
  GENAIVF.V_MNP_ACTUAL:
    as_of_sql: null
    columns:
    - confidence: high
      description: The actual due date of the number porting as forwarded by BTK, from which the subscriber can
        use their new line.
      name: NUM_PORT_ACTUAL_DUE_DT
      shape: date
      type: DATE
    - confidence: high
      description: The donor operator name from which the number is ported out.
      meanings:
        Turkcell: Turkcell as the donor operator
        Türk Telekom: Türk Telekom as the donor operator
        Vodafone: Vodafone as the donor operator
      name: DONOR_SP_NAME
      shape: code
      type: VARCHAR2(72)
      values:
      - Vodafone
      - Turkcell
      - Türk Telekom
    - confidence: high
      description: The recipient operator name to which the number is ported in.
      meanings:
        Turkcell: Turkcell as the recipient operator
        Türk Telekom: Türk Telekom as the recipient operator
        Vodafone: Vodafone as the recipient operator
      name: APPLIED_SP_NAME
      shape: code
      type: VARCHAR2(72)
      values:
      - Vodafone
      - Turkcell
      - Türk Telekom
    - confidence: high
      description: Subscriber customer combination type, indicating prepaid/postpaid and consumer business unit
        types.
      meanings:
        POS CBU: Postpaid Consumer Business Unit
        POS EBU: Postpaid Enterprise Business Unit
        PRE CBU: Prepaid Consumer Business Unit
        PRE EBU: Prepaid Enterprise Business Unit
      name: SUBS_CUST_COMB_TYPE
      shape: code
      type: VARCHAR2(44)
      values:
      - POS CBU
      - PRE CBU
      - POS EBU
      - PRE EBU
    - confidence: high
      description: Group status description of the number portability operation, which is constantly Success in
        this view.
      meanings:
        Success: Successful porting operation
      name: NUM_PORT_ACTUAL_GRP_STATUS_DESC
      shape: constant
      type: VARCHAR2(44)
      values:
      - Success
    current_sql: null
    description: The table GENAIVF.V_MNP_ACTUAL contains details on actual mobile number portability (MNP) porting
      operations, including donor and recipient operators, subscriber customer types, and porting execution dates.
    grain:
      columns: []
      text: no unique column and no entity + date combination found; count with care
      verified: false
    kind: unkeyed
    row_count: 5788
    row_meaning: Each row represents a mobile number portability transaction.
    rule: null
    unknowns:
    - Unique subscriber identifier or phone number column is missing from this view.
  GENAIVF.V_MNP_REQUEST:
    as_of_sql: null
    columns:
    - confidence: high
      description: Number port request type description indicating whether the number is porting in or port out.
      meanings:
        Port In: The number is being ported into the operator (4526 rows).
        Port Out: The number is being ported out to another operator (3774 rows).
      name: NUM_PORT_REQUEST_TYPE_DESC
      shape: flag
      type: VARCHAR2(48)
      values:
      - Port In
      - Port Out
    - confidence: high
      description: Timestamp when the number port request was submitted.
      name: NUM_PORT_REQUEST_SUBMITTED_DT
      shape: date
      type: DATE
    - confidence: high
      description: Process start date with BTK (Information and Communication Technologies Authority).
      name: BTK_PROCESS_START_DATE
      shape: date
      type: DATE
    - confidence: high
      description: Name of the donor operator from which the number is being ported.
      meanings:
        Turkcell: Turkcell is the donor operator (2716 rows).
        Türk Telekom: Türk Telekom is the donor operator (1810 rows).
        Vodafone: Vodafone is the donor operator (3774 rows).
      name: DONOR_SP_NAME
      shape: code
      type: VARCHAR2(72)
      values:
      - Vodafone
      - Turkcell
      - Türk Telekom
    - confidence: high
      description: Name of the recipient/applied operator to which the number is being ported.
      meanings:
        Turkcell: Turkcell is the applied/recipient operator (2142 rows).
        Türk Telekom: Türk Telekom is the applied/recipient operator (1632 rows).
        Vodafone: Vodafone is the applied/recipient operator (4526 rows).
      name: APPLIED_SP_NAME
      shape: code
      type: VARCHAR2(72)
      values:
      - Vodafone
      - Turkcell
      - Türk Telekom
    - confidence: high
      description: Subscriber customer combination type (e.g., POS CBU, PRE CBU, POS EBU, PRE EBU).
      meanings:
        POS CBU: Postpaid Consumer Business Unit subscriber (5270 rows).
        POS EBU: Postpaid Enterprise Business Unit subscriber (780 rows).
        PRE CBU: Prepaid Consumer Business Unit subscriber (1902 rows).
        PRE EBU: Prepaid Enterprise Business Unit subscriber (348 rows).
      name: SUBS_CUST_COMB_TYPE
      shape: code
      type: VARCHAR2(44)
      values:
      - POS CBU
      - PRE CBU
      - POS EBU
      - PRE EBU
    - confidence: high
      description: Group status description of the number port request (Success, Submitted, Cancelled, Rejected).
      meanings:
        Cancelled: Port request has been cancelled (678 rows).
        Rejected: Port request has been rejected (611 rows).
        Submitted: Port request has been submitted (1223 rows).
        Success: Port request completed successfully (5788 rows).
      name: NUM_PORT_REQUEST_GRP_STATUS_DESC
      shape: code
      type: VARCHAR2(56)
      values:
      - Success
      - Submitted
      - Cancelled
      - Rejected
    - confidence: high
      description: Detailed status description of the number port request.
      name: NUM_PORT_REQUEST_STATUS_DESC
      shape: code
      type: VARCHAR2(188)
      values:
      - Numara aktif edildi
      - Taşıma tamamlandı
      - BTK onayı bekleniyor
      - Abone doğrulama bekleniyor
      - Donör operatör onayı bekleniyor
      - Süre aşımı ile iptal
      - Abone talebi ile iptal
      - Borç nedeniyle red
      - Donör operatör reddi
      - Kimlik uyuşmazlığı
    current_sql: null
    description: This table stores mobile number portability (MNP) requests, capturing request types, submission
      and process dates, donor and recipient operators, subscriber customer types, and request statuses.
    grain:
      columns: []
      text: no unique column and no entity + date combination found; count with care
      verified: false
    kind: unkeyed
    row_count: 8300
    row_meaning: Each row represents a single mobile number portability request.
    rule: null
    unknowns:
    - Whether individual requests can be uniquely identified by a combination of columns since there is no primary
      key or explicit ID column.
  VID.D_CONV_SEGMENT_HIST:
